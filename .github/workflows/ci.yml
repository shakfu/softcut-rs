# Mirrors `make test`, `make lint` and `make publish-dry`. Commands are spelled
# out because the Windows runner has no make.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu and windows are x86-64, macos is arm64: the golden fixtures
        # were recorded on x86-64 Linux, so this checks parity across libms and ISAs.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux audio and windowing headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libwayland-dev libxkbcommon-dev
      - name: Test softcut without features
        run: cargo test -p softcut-rs
      - name: Test workspace with all features
        run: cargo test --workspace --all-features

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux audio and windowing headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libwayland-dev libxkbcommon-dev
      - run: cargo fmt --all --check
      - run: cargo clippy -p softcut-rs --all-targets
      - run: cargo clippy --workspace --all-targets --all-features
      - name: Docs build without broken links
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p softcut-rs --no-deps --all-features
      - name: Crates package and build as published
        run: cargo publish --workspace --exclude softcut-demo --dry-run
