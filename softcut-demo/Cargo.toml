[package]
name = "softcut-demo"
version = "0.1.0"
description = "egui demo of the softcut crate: live looping with visual buffer, loops and playheads"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
softcut = { path = "../softcut", features = ["rtrb"] }
softcut-fx = { path = "../softcut-fx" }
softcut-osc = { path = "../softcut-osc" }
cpal = "0.18"
eframe = "0.36"
rtrb = "0.4"
hound = "3.5"
rfd = "0.17"
